<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050608"
>

<title>Л.И.С.А.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050608;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
}

body {
    touch-action: none;
    overscroll-behavior: none;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #050608;
}

canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
    touch-action: none;
}


/* =========================================================
   SEARCH BUTTON
   ========================================================= */

#searchButton {
    position: absolute;
    z-index: 10;

    top:
        calc(
            env(safe-area-inset-top) +
            18px
        );

    right: 18px;

    width: 46px;
    height: 46px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.07);

    display: grid;
    place-items: center;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

#searchButton svg {
    width: 20px;
    height: 20px;

    fill: none;

    stroke:
        rgba(255,255,255,.82);

    stroke-width: 1.8;
}


/* =========================================================
   SEARCH OVERLAY
   ========================================================= */

#searchOverlay {
    position: absolute;
    inset: 0;

    z-index: 30;

    opacity: 0;
    pointer-events: none;

    background:
        rgba(3,4,6,.72);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    transition:
        opacity .2s ease;
}

#searchOverlay.active {
    opacity: 1;
    pointer-events: auto;
}

.searchPanel {
    position: absolute;

    left: 18px;
    right: 18px;

    top:
        calc(
            env(safe-area-inset-top) +
            76px
        );

    height: 56px;

    border-radius: 19px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,.36),
        inset 0 1px 0 rgba(255,255,255,.06);

    display: flex;

    align-items: center;

    padding:
        0
        14px
        0
        17px;
}

.searchPanel svg {
    width: 20px;
    height: 20px;

    fill: none;

    stroke:
        rgba(255,255,255,.52);
}

.searchPanel input {
    flex: 1;

    min-width: 0;

    height: 100%;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-size: 17px;

    margin-left: 12px;
}

.searchPanel input::placeholder {
    color:
        rgba(255,255,255,.38);
}

.closeSearch {
    width: 34px;
    height: 34px;

    border: 0;

    background: transparent;

    color:
        rgba(255,255,255,.55);

    font-size: 25px;

    line-height: 1;
}

</style>
</head>


<body>

<div id="app">

    <canvas id="canvas"></canvas>

    <button
        id="searchButton"
        aria-label="Поиск"
    >

        <svg viewBox="0 0 24 24">

            <circle
                cx="10.8"
                cy="10.8"
                r="6.6"
            ></circle>

            <path d="M16 16l5 5"></path>

        </svg>

    </button>


    <div id="searchOverlay">

        <div class="searchPanel">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="10.8"
                    cy="10.8"
                    r="6.6"
                ></circle>

                <path d="M16 16l5 5"></path>

            </svg>


            <input
                id="searchInput"
                type="text"
                placeholder="Поиск"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            >


            <button
                id="closeSearch"
                class="closeSearch"
            >
                ×
            </button>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: true,
            desynchronized: true
        }
    );

const sourceCanvas =
    document.createElement("canvas");

const sourceCtx =
    sourceCanvas.getContext(
        "2d",
        {
            alpha: true,
            desynchronized: true
        }
    );

const lensBuffer =
    document.createElement("canvas");

const lensCtx =
    lensBuffer.getContext(
        "2d",
        {
            alpha: true,
            desynchronized: true
        }
    );


/* =========================================================
   RESOLUTION
   ========================================================= */

let DPR =
    Math.min(
        window.devicePixelRatio || 1,
        3
    );


const BUFFER_SCALE = 4;

const MAX_LENS_W = 150;
const MAX_LENS_H = 92;


lensBuffer.width =
    MAX_LENS_W *
    BUFFER_SCALE;

lensBuffer.height =
    MAX_LENS_H *
    BUFFER_SCALE;


let W = 1;
let H = 1;


/* =========================================================
   TABS
   ========================================================= */

const tabs = [

    {
        title: "Контакты",
        icon: "contacts"
    },

    {
        title: "Звонки",
        icon: "calls"
    },

    {
        title: "Чаты",
        icon: "chat"
    },

    {
        title: "Настройки",
        icon: "settings"
    }

];


let activeTab = 2;


/* =========================================================
   NAV
   ========================================================= */

const nav = {

    x: 0,
    y: 0,

    width: 0,
    height: 68,

    radius: 34

};


/* =========================================================
   LENS
   ========================================================= */

const lens = {

    x: 0,
    y: 0,

    targetX: 0,
    targetY: 0,

    width: 88,
    height: 60,

    targetWidth: 88,
    targetHeight: 60,

    speed: 0,
    targetSpeed: 0,

    scrollZoom: 0,
    targetScrollZoom: 0,

    dragging: false,

    pointerId: null,

    grabOffsetX: 0,

    lastPointerX: 0,
    lastMoveTime: 0

};


/* =========================================================
   OPTICS
   ========================================================= */

const OPTICS = {

    /*
     * Увеличение содержимого.
     */
    magnificationMin: 1.08,
    magnificationMax: 1.22,

    minWidth: 88,
    maxWidth: 136,

    minHeight: 60,
    maxHeight: 82,

    /*
     * 20% от каждого края.
     */
    edge: 0.20,

    /*
     * СИЛА ПРЕЛОМЛЕНИЯ.
     *
     * Было 0.055.
     *
     * Теперь эффект намеренно
     * заметный.
     */
    baseRefraction: 0.17,

    movementRefraction: 0.09,

    maxScrollZoom: 0.075

};


let sourceDirty = true;


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    W =
        Math.max(
            1,
            window.innerWidth
        );

    H =
        Math.max(
            1,
            window.innerHeight
        );


    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            3
        );


    canvas.width =
        Math.round(
            W * DPR
        );

    canvas.height =
        Math.round(
            H * DPR
        );


    sourceCanvas.width =
        Math.round(
            W * DPR
        );

    sourceCanvas.height =
        Math.round(
            H * DPR
        );


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    sourceCtx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    sourceCtx.imageSmoothingEnabled = true;
    sourceCtx.imageSmoothingQuality = "high";


    updateNav();


    lens.y =
        nav.y +
        nav.height / 2;

    lens.targetY =
        lens.y;


    if (!lens.x) {

        lens.x =
            tabCenter(activeTab);

        lens.targetX =
            lens.x;
    }


    sourceDirty = true;
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   NAV GEOMETRY
   ========================================================= */

function updateNav() {

    nav.width =
        Math.min(
            W - 28,
            382
        );

    nav.height = 68;

    nav.x =
        (W - nav.width) / 2;


    const bottom =
        /iPhone|iPad|iPod/i.test(
            navigator.userAgent
        )
        ? 28
        : 18;


    nav.y =
        H -
        nav.height -
        bottom;
}


function tabCenter(index) {

    const itemWidth =
        nav.width /
        tabs.length;


    return (
        nav.x +
        itemWidth * index +
        itemWidth / 2
    );
}


/* =========================================================
   GEOMETRY
   ========================================================= */

function roundedRectPath(
    c,
    x,
    y,
    w,
    h,
    r
) {

    r =
        Math.min(
            r,
            w / 2,
            h / 2
        );


    c.beginPath();

    c.moveTo(
        x + r,
        y
    );

    c.arcTo(
        x + w,
        y,
        x + w,
        y + h,
        r
    );

    c.arcTo(
        x + w,
        y + h,
        x,
        y + h,
        r
    );

    c.arcTo(
        x,
        y + h,
        x,
        y,
        r
    );

    c.arcTo(
        x,
        y,
        x + w,
        y,
        r
    );

    c.closePath();
}


function lensPath(
    c,
    x,
    y,
    w,
    h
) {

    const r =
        Math.min(
            h * .49,
            42
        );


    roundedRectPath(
        c,

        x - w / 2,
        y - h / 2,

        w,
        h,

        r
    );
}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground(c) {

    c.fillStyle =
        "#050608";

    c.fillRect(
        0,
        0,
        W,
        H
    );


    const glow =
        c.createRadialGradient(
            W * .5,
            H * .15,
            0,
            W * .5,
            H * .15,
            Math.max(W, H) * .65
        );


    glow.addColorStop(
        0,
        "rgba(255,255,255,.045)"
    );

    glow.addColorStop(
        .55,
        "rgba(255,255,255,.012)"
    );

    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    c.fillStyle = glow;

    c.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   CARD
   ========================================================= */

function drawCard(
    c,
    x,
    y,
    w,
    h,
    title,
    subtitle,
    symbol
) {

    roundedRectPath(
        c,
        x,
        y,
        w,
        h,
        24
    );


    c.fillStyle =
        "rgba(255,255,255,.045)";

    c.fill();


    c.strokeStyle =
        "rgba(255,255,255,.055)";

    c.lineWidth = 1;

    c.stroke();


    c.beginPath();

    c.arc(
        x + 38,
        y + 38,
        18,
        0,
        Math.PI * 2
    );


    c.fillStyle =
        "rgba(255,255,255,.065)";

    c.fill();


    c.fillStyle =
        "rgba(255,255,255,.82)";

    c.font =
        "19px -apple-system, BlinkMacSystemFont, sans-serif";

    c.textAlign = "center";
    c.textBaseline = "middle";


    c.fillText(
        symbol,
        x + 38,
        y + 39
    );


    c.textAlign = "left";


    c.fillStyle =
        "rgba(255,255,255,.88)";

    c.font =
        "600 16px -apple-system, BlinkMacSystemFont, sans-serif";


    c.fillText(
        title,
        x + 70,
        y + 31
    );


    c.fillStyle =
        "rgba(255,255,255,.38)";

    c.font =
        "14px -apple-system, BlinkMacSystemFont, sans-serif";


    c.fillText(
        subtitle,
        x + 70,
        y + 53
    );
}


/* =========================================================
   ICON
   ========================================================= */

function drawIcon(
    c,
    type,
    x,
    y,
    size,
    color
) {

    c.save();


    c.translate(
        x,
        y
    );


    c.scale(
        size / 24,
        size / 24
    );


    c.strokeStyle =
        color;

    c.fillStyle =
        color;

    c.lineWidth = 1.75;

    c.lineCap = "round";
    c.lineJoin = "round";


    if (type === "contacts") {

        c.beginPath();

        c.arc(
            12,
            8,
            3.2,
            0,
            Math.PI * 2
        );

        c.stroke();


        c.beginPath();

        c.arc(
            12,
            17,
            5,
            Math.PI,
            0
        );

        c.stroke();
    }


    else if (type === "calls") {

        c.beginPath();

        c.moveTo(7,4);
        c.lineTo(10,7);
        c.lineTo(8,10);

        c.bezierCurveTo(
            9.5,
            13.2,
            11,
            14.7,
            14,
            16
        );

        c.lineTo(17,14);
        c.lineTo(20,17);

        c.bezierCurveTo(
            18,
            21,
            15,
            21,
            11,
            18
        );

        c.bezierCurveTo(
            7,
            15,
            4,
            11,
            4,
            7
        );

        c.closePath();

        c.stroke();
    }


    else if (type === "chat") {

        roundedRectPath(
            c,
            4,
            5,
            16,
            12,
            4
        );

        c.stroke();


        c.beginPath();

        c.moveTo(8,17);
        c.lineTo(8,20);
        c.lineTo(11,17);

        c.stroke();
    }


    else if (type === "settings") {

        c.beginPath();

        c.arc(
            12,
            12,
            3.2,
            0,
            Math.PI * 2
        );

        c.stroke();


        for (
            let i = 0;
            i < 8;
            i++
        ) {

            const a =
                i *
                Math.PI /
                4;


            c.beginPath();

            c.moveTo(
                Math.cos(a) * 6,
                Math.sin(a) * 6
            );

            c.lineTo(
                Math.cos(a) * 9,
                Math.sin(a) * 9
            );

            c.stroke();
        }
    }


    c.restore();
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function drawNavigation(c) {

    c.save();


    c.shadowColor =
        "rgba(0,0,0,.17)";

    c.shadowBlur = 20;
    c.shadowOffsetY = 7;


    roundedRectPath(
        c,
        nav.x,
        nav.y,
        nav.width,
        nav.height,
        nav.radius
    );


    c.fillStyle =
        "rgba(255,255,255,.04)";

    c.fill();


    c.restore();


    roundedRectPath(
        c,
        nav.x,
        nav.y,
        nav.width,
        nav.height,
        nav.radius
    );


    const glass =
        c.createLinearGradient(
            nav.x,
            nav.y,
            nav.x,
            nav.y + nav.height
        );


    glass.addColorStop(
        0,
        "rgba(255,255,255,.095)"
    );

    glass.addColorStop(
        .5,
        "rgba(255,255,255,.05)"
    );

    glass.addColorStop(
        1,
        "rgba(255,255,255,.03)"
    );


    c.fillStyle = glass;

    c.fill();


    c.strokeStyle =
        "rgba(255,255,255,.09)";

    c.lineWidth = 1;

    c.stroke();


    c.beginPath();

    c.moveTo(
        nav.x + 30,
        nav.y + .7
    );

    c.lineTo(
        nav.x +
        nav.width -
        30,
        nav.y + .7
    );


    c.strokeStyle =
        "rgba(255,255,255,.08)";

    c.stroke();


    const itemWidth =
        nav.width /
        tabs.length;


    for (
        let i = 0;
        i < tabs.length;
        i++
    ) {

        const cx =
            nav.x +
            itemWidth * i +
            itemWidth / 2;


        const centerY =
            nav.y +
            nav.height / 2;


        /*
         * Иконка поднята.
         */
        const iconY =
            centerY - 10;


        const active =
            i === activeTab;


        drawIcon(
            c,
            tabs[i].icon,
            cx,
            iconY,
            23,

            active
                ? "rgba(255,255,255,.98)"
                : "rgba(255,255,255,.46)"
        );


        c.textAlign =
            "center";

        c.textBaseline =
            "top";


        c.font =
            active
                ? "600 9px -apple-system, BlinkMacSystemFont, sans-serif"
                : "500 9px -apple-system, BlinkMacSystemFont, sans-serif";


        c.fillStyle =
            active
                ? "rgba(255,255,255,.80)"
                : "rgba(255,255,255,.34)";


        c.fillText(
            tabs[i].title,
            cx,
            centerY + 8
        );
    }


    c.textAlign = "left";
    c.textBaseline = "alphabetic";
}


/* =========================================================
   SOURCE RENDER
   ========================================================= */

function renderSource() {

    if (!sourceDirty) {
        return;
    }


    sourceCtx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    sourceCtx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground(
        sourceCtx
    );


    sourceCtx.fillStyle =
        "rgba(255,255,255,.92)";


    sourceCtx.font =
        "700 27px -apple-system, BlinkMacSystemFont, sans-serif";


    sourceCtx.fillText(
        "Л.И.С.А.",
        22,
        76
    );


    sourceCtx.fillStyle =
        "rgba(255,255,255,.36)";


    sourceCtx.font =
        "14px -apple-system, BlinkMacSystemFont, sans-serif";


    sourceCtx.fillText(
        "Личный интеллектуальный ассистент",
        23,
        99
    );


    const margin = 18;
    const gap = 13;

    const cardW =
        W -
        margin * 2;

    const cardH = 78;


    const startY =
        Math.max(
            145,
            H * .20
        );


    drawCard(
        sourceCtx,
        margin,
        startY,
        cardW,
        cardH,
        "Контакты",
        "Люди и профили",
        "●"
    );


    drawCard(
        sourceCtx,
        margin,
        startY +
        cardH +
        gap,
        cardW,
        cardH,
        "Звонки",
        "История вызовов",
        "⌕"
    );


    drawCard(
        sourceCtx,
        margin,
        startY +
        (cardH + gap) * 2,
        cardW,
        cardH,
        "Чаты",
        "Последние сообщения",
        "●"
    );


    drawNavigation(
        sourceCtx
    );


    sourceDirty = false;
}


/* =========================================================
   MAGNIFICATION
   ========================================================= */

function getMagnification() {

    const movement =
        Math.min(
            1,
            lens.speed
        );


    const scroll =
        Math.min(
            OPTICS.maxScrollZoom,
            lens.scrollZoom
        );


    return Math.min(

        OPTICS.magnificationMax,

        OPTICS.magnificationMin

        +

        (
            OPTICS.magnificationMax -
            OPTICS.magnificationMin
        )

        *

        (
            .35 +
            movement * .65
        )

        +

        scroll
    );
}


/* =========================================================
   SOURCE CENTER
   ========================================================= */

function getLensSourceCenterY() {

    /*
     * Центр изображения внутри линзы
     * совпадает с центром иконки.
     */
    return lens.y - 10;
}


/* =========================================================
   BUILD LENS BUFFER
   ========================================================= */

function buildLensBuffer() {

    const w =
        lens.width;

    const h =
        lens.height;


    lensCtx.setTransform(
        BUFFER_SCALE,
        0,
        0,
        BUFFER_SCALE,
        0,
        0
    );


    lensCtx.clearRect(
        0,
        0,
        MAX_LENS_W,
        MAX_LENS_H
    );


    lensCtx.imageSmoothingEnabled = true;
    lensCtx.imageSmoothingQuality = "high";


    const mag =
        getMagnification();


    const sourceW =
        w / mag;

    const sourceH =
        h / mag;


    const sourceCenterX =
        lens.x;


    const sourceCenterY =
        getLensSourceCenterY();


    const sx =
        sourceCenterX -
        sourceW / 2;


    const sy =
        sourceCenterY -
        sourceH / 2;


    const bx =
        (
            MAX_LENS_W -
            w
        ) / 2;


    const by =
        (
            MAX_LENS_H -
            h
        ) / 2;


    lensCtx.drawImage(

        sourceCanvas,

        sx * DPR,
        sy * DPR,

        sourceW * DPR,
        sourceH * DPR,

        bx,
        by,

        w,
        h
    );
}


/* =========================================================
   OPTICAL LAYER DRAW
   ========================================================= */

/*
 * Рисует отдельный слой линзы.
 *
 * scale > 1:
 * содержимое растягивается.
 *
 * dx / dy:
 * дополнительное смещение изображения.
 */

function drawLensLayer(
    x,
    y,
    w,
    h,
    bx,
    by,
    scale,
    alpha,
    dx,
    dy
) {

    const drawW =
        w * scale;

    const drawH =
        h * scale;


    const drawX =
        x -
        drawW / 2 +
        dx;


    const drawY =
        y -
        drawH / 2 +
        dy;


    ctx.globalAlpha =
        alpha;


    ctx.drawImage(

        lensBuffer,

        bx * BUFFER_SCALE,
        by * BUFFER_SCALE,

        w * BUFFER_SCALE,
        h * BUFFER_SCALE,

        drawX,
        drawY,

        drawW,
        drawH
    );
}


/* =========================================================
   OPTICAL REFRACTION
   ========================================================= */

function drawOpticalRefraction() {

    const x =
        lens.x;

    const y =
        lens.y;

    const w =
        lens.width;

    const h =
        lens.height;


    const bx =
        (
            MAX_LENS_W -
            w
        ) / 2;

    const by =
        (
            MAX_LENS_H -
            h
        ) / 2;


    const movement =
        Math.min(
            1,
            lens.speed
        );


    /*
     * Базовая деформация.
     */
    const strength =
        OPTICS.baseRefraction
        +
        OPTICS.movementRefraction *
        movement;


    /*
     * Размер 20% зоны.
     */
    const edgeX =
        w *
        OPTICS.edge;


    const edgeY =
        h *
        OPTICS.edge;


    /*
     * Большое количество
     * плавных слоёв.
     */
    const layers = 18;


    /*
     * Сначала рисуем сильное
     * преломление у самого края.
     *
     * Затем постепенно уменьшаем
     * его к центру.
     */
    for (
        let i = 0;
        i < layers;
        i++
    ) {

        const t =
            i /
            (layers - 1);


        /*
         * t = 0
         * самый внешний край.
         *
         * t = 1
         * внутренняя граница.
         */


        /*
         * Плавность перехода.
         */
        const fade =
            Math.pow(
                1 - t,
                1.45
            );


        /*
         * Масштаб текущего
         * преломления.
         */
        const scale =
            1 +
            strength *
            fade;


        /*
         * Чем ближе к центру,
         * тем меньше зона.
         */
        const insetX =
            edgeX *
            t;


        const insetY =
            edgeY *
            t;


        const areaW =
            w -
            insetX * 2;


        const areaH =
            h -
            insetY * 2;


        /*
         * Мягкость краёв.
         */
        const radius =
            Math.min(
                areaH * .49,
                42
            );


        /*
         * Клип текущего слоя.
         */
        ctx.save();


        roundedRectPath(

            ctx,

            x -
            areaW / 2,

            y -
            areaH / 2,

            areaW,
            areaH,

            radius
        );


        ctx.clip();


        /*
         * Увеличиваем внешний край.
         *
         * alpha здесь намеренно
         * высокий, иначе эффект
         * снова исчезает.
         */
        const alpha =
            0.72 *
            fade;


        /*
         * Небольшое радиальное
         * смещение.
         *
         * Оно заставляет линии
         * около края "ломаться",
         * а не просто становиться
         * больше.
         */
        const direction =
            1 -
            t;


        const movementShift =
            1.2 *
            direction;


        /*
         * Горизонтальный компонент.
         */
        const dx =
            Math.cos(
                (x + i * 17) * .013
            )
            *
            movementShift;


        /*
         * Вертикальный компонент.
         */
        const dy =
            Math.sin(
                (y + i * 23) * .017
            )
            *
            movementShift;


        drawLensLayer(

            x,
            y,
            w,
            h,

            bx,
            by,

            scale,
            alpha,

            dx,
            dy
        );


        ctx.restore();
    }


    /*
     * Теперь возвращаем абсолютно чистый
     * центральный участок.
     *
     * Это делает переход контролируемым:
     * центр не мутнеет и не получает
     * многократное наложение.
     */
    const centerW =
        w -
        edgeX * 2;


    const centerH =
        h -
        edgeY * 2;


    ctx.save();


    roundedRectPath(

        ctx,

        x -
        centerW / 2,

        y -
        centerH / 2,

        centerW,
        centerH,

        Math.min(
            centerH * .49,
            42
        )
    );


    ctx.clip();


    ctx.globalAlpha = 1;


    ctx.drawImage(

        lensBuffer,

        bx * BUFFER_SCALE,
        by * BUFFER_SCALE,

        w * BUFFER_SCALE,
        h * BUFFER_SCALE,

        x - w / 2,
        y - h / 2,

        w,
        h
    );


    ctx.restore();
}


/* =========================================================
   LENS RENDER
   ========================================================= */

function renderLens() {

    const x =
        lens.x;

    const y =
        lens.y;

    const w =
        lens.width;

    const h =
        lens.height;


    buildLensBuffer();


    const bx =
        (
            MAX_LENS_W -
            w
        ) / 2;

    const by =
        (
            MAX_LENS_H -
            h
        ) / 2;


    /*
     * Базовая прозрачная линза.
     */
    ctx.save();


    lensPath(
        ctx,
        x,
        y,
        w,
        h
    );


    ctx.clip();


    ctx.globalAlpha = 1;


    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";


    ctx.drawImage(

        lensBuffer,

        bx * BUFFER_SCALE,
        by * BUFFER_SCALE,

        w * BUFFER_SCALE,
        h * BUFFER_SCALE,

        x - w / 2,
        y - h / 2,

        w,
        h
    );


    ctx.restore();


    /*
     * Сильное оптическое
     * преломление по всей
     * геометрии.
     */
    ctx.save();


    lensPath(
        ctx,
        x,
        y,
        w,
        h
    );


    ctx.clip();


    ctx.globalCompositeOperation =
        "source-over";


    drawOpticalRefraction();


    ctx.restore();


    /*
     * Финальный тонкий контур.
     *
     * Никакой внутренней рамки.
     */
    ctx.save();


    lensPath(
        ctx,
        x,
        y,
        w,
        h
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.075)";

    ctx.lineWidth = 1;

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   PHYSICS
   ========================================================= */

function lerp(
    a,
    b,
    t
) {

    return (
        a +
        (b - a) *
        t
    );
}


function updatePhysics(dt) {

    lens.x =
        lerp(
            lens.x,
            lens.targetX,

            Math.min(
                1,
                dt *
                (
                    lens.dragging
                        ? 25
                        : 14
                )
            )
        );


    lens.y =
        lerp(
            lens.y,
            lens.targetY,
            Math.min(
                1,
                dt * 18
            )
        );


    lens.speed =
        lerp(
            lens.speed,
            lens.targetSpeed,
            Math.min(
                1,
                dt * 10
            )
        );


    lens.targetSpeed *=
        Math.pow(
            .045,
            dt
        );


    lens.scrollZoom =
        lerp(
            lens.scrollZoom,
            lens.targetScrollZoom,
            Math.min(
                1,
                dt * 6
            )
        );


    lens.targetScrollZoom *=
        Math.pow(
            .20,
            dt
        );


    const movement =
        Math.min(
            1,
            lens.speed
        );


    const scroll =
        Math.min(
            1,
            lens.scrollZoom /
            OPTICS.maxScrollZoom
        );


    const growth =
        Math.max(
            movement,
            scroll * .9
        );


    lens.targetWidth =
        OPTICS.minWidth
        +
        (
            OPTICS.maxWidth -
            OPTICS.minWidth
        )
        *
        growth;


    lens.targetHeight =
        OPTICS.minHeight
        +
        (
            OPTICS.maxHeight -
            OPTICS.minHeight
        )
        *
        growth;


    lens.width =
        lerp(
            lens.width,
            lens.targetWidth,
            Math.min(
                1,
                dt * 13
            )
        );


    lens.height =
        lerp(
            lens.height,
            lens.targetHeight,
            Math.min(
                1,
                dt * 13
            )
        );
}


/* =========================================================
   SNAP
   ========================================================= */

function snapToTab(index) {

    index =
        Math.max(
            0,
            Math.min(
                tabs.length - 1,
                index
            )
        );


    activeTab =
        index;


    lens.targetX =
        tabCenter(index);


    lens.targetY =
        nav.y +
        nav.height / 2;


    lens.targetSpeed =
        .30;


    sourceDirty =
        true;
}


/* =========================================================
   HIT TEST
   ========================================================= */

function nearestTab(px) {

    const itemWidth =
        nav.width /
        tabs.length;


    const index =
        Math.floor(
            (
                px -
                nav.x
            ) /
            itemWidth
        );


    return Math.max(
        0,
        Math.min(
            tabs.length - 1,
            index
        )
    );
}


function pointInLens(
    px,
    py
) {

    const dx =
        px -
        lens.x;


    const dy =
        py -
        lens.y;


    const rx =
        lens.width / 2 +
        12;


    const ry =
        lens.height / 2 +
        12;


    return (
        dx * dx /
        (rx * rx)

        +

        dy * dy /
        (ry * ry)

        <= 1
    );
}


function pointInNav(
    px,
    py
) {

    return (

        px >=
        nav.x - 14

        &&

        px <=
        nav.x +
        nav.width +
        14

        &&

        py >=
        nav.y - 22

        &&

        py <=
        nav.y +
        nav.height +
        22
    );
}


/* =========================================================
   POINTER DOWN
   ========================================================= */

function onPointerDown(e) {

    const rect =
        canvas.getBoundingClientRect();


    const px =
        e.clientX -
        rect.left;


    const py =
        e.clientY -
        rect.top;


    if (
        pointInLens(
            px,
            py
        )
    ) {

        lens.dragging =
            true;


        lens.pointerId =
            e.pointerId;


        lens.grabOffsetX =
            px -
            lens.x;


        lens.lastPointerX =
            px;


        lens.lastMoveTime =
            performance.now();


        try {

            canvas.setPointerCapture(
                e.pointerId
            );

        } catch (_) {}


        e.preventDefault();

        return;
    }


    if (
        pointInNav(
            px,
            py
        )
    ) {

        snapToTab(
            nearestTab(px)
        );


        e.preventDefault();
    }
}


/* =========================================================
   POINTER MOVE
   ========================================================= */

function onPointerMove(e) {

    if (
        !lens.dragging ||
        e.pointerId !== lens.pointerId
    ) {
        return;
    }


    const rect =
        canvas.getBoundingClientRect();


    const px =
        e.clientX -
        rect.left;


    const half =
        nav.width /
        tabs.length /
        2;


    const minX =
        nav.x +
        half;


    const maxX =
        nav.x +
        nav.width -
        half;


    lens.targetX =
        Math.max(
            minX,
            Math.min(
                maxX,
                px -
                lens.grabOffsetX
            )
        );


    lens.targetY =
        nav.y +
        nav.height / 2;


    const now =
        performance.now();


    const delta =
        Math.max(
            8,
            now -
            lens.lastMoveTime
        );


    const dx =
        px -
        lens.lastPointerX;


    const velocity =
        Math.abs(dx) /
        delta;


    lens.targetSpeed =
        Math.min(
            1,
            velocity * 1.8
        );


    lens.lastPointerX =
        px;


    lens.lastMoveTime =
        now;


    e.preventDefault();
}


/* =========================================================
   POINTER UP
   ========================================================= */

function onPointerUp(e) {

    if (
        e.pointerId !==
        lens.pointerId
    ) {
        return;
    }


    lens.dragging =
        false;


    lens.pointerId =
        null;


    snapToTab(
        nearestTab(
            lens.targetX
        )
    );
}


/* =========================================================
   WHEEL
   ========================================================= */

function onWheel(e) {

    if (
        Math.abs(e.deltaY) > 0
    ) {

        lens.targetScrollZoom =
            Math.min(
                OPTICS.maxScrollZoom,

                lens.targetScrollZoom
                +
                Math.abs(e.deltaY)
                *
                .00045
            );
    }


    if (
        Math.abs(e.deltaX) > 0
    ) {

        lens.targetX +=
            e.deltaX *
            .72;


        const half =
            nav.width /
            tabs.length /
            2;


        lens.targetX =
            Math.max(
                nav.x + half,

                Math.min(
                    nav.x +
                    nav.width -
                    half,

                    lens.targetX
                )
            );


        lens.targetSpeed =
            Math.min(
                1,
                Math.abs(
                    e.deltaX
                ) *
                .025
            );
    }


    e.preventDefault();
}


/* =========================================================
   POINTER EVENTS
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    onPointerDown,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointermove",
    onPointerMove,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointerup",
    onPointerUp,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointercancel",
    onPointerUp,
    {
        passive: false
    }
);


canvas.addEventListener(
    "wheel",
    onWheel,
    {
        passive: false
    }
);


/* =========================================================
   SEARCH
   ========================================================= */

const searchButton =
    document.getElementById(
        "searchButton"
    );


const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const closeSearch =
    document.getElementById(
        "closeSearch"
    );


searchButton.addEventListener(
    "click",
    () => {

        searchOverlay.classList.add(
            "active"
        );


        setTimeout(
            () => {
                searchInput.focus();
            },
            100
        );
    }
);


closeSearch.addEventListener(
    "click",
    () => {

        searchOverlay.classList.remove(
            "active"
        );

        searchInput.blur();
    }
);


searchOverlay.addEventListener(
    "click",
    e => {

        if (
            e.target ===
            searchOverlay
        ) {

            searchOverlay.classList.remove(
                "active"
            );

            searchInput.blur();
        }
    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if (
            e.key ===
            "Escape"
        ) {

            searchOverlay.classList.remove(
                "active"
            );

            searchInput.blur();
        }


        if (
            e.key ===
            "ArrowLeft"
        ) {

            snapToTab(
                activeTab - 1
            );
        }


        if (
            e.key ===
            "ArrowRight"
        ) {

            snapToTab(
                activeTab + 1
            );
        }
    }
);


/* =========================================================
   MAIN LOOP
   ========================================================= */

let lastTime =
    performance.now();


function frame(now) {

    const dt =
        Math.min(
            .05,
            (
                now -
                lastTime
            ) / 1000
        );


    lastTime =
        now;


    updatePhysics(dt);


    renderSource();


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    /*
     * Основная сцена.
     */
    ctx.drawImage(

        sourceCanvas,

        0,
        0,

        W * DPR,
        H * DPR,

        0,
        0,

        W,
        H
    );


    /*
     * Линза поверх сцены.
     */
    renderLens();


    requestAnimationFrame(
        frame
    );
}


/* =========================================================
   INITIALIZE
   ========================================================= */

resize();


snapToTab(2);


lens.x =
    tabCenter(2);

lens.targetX =
    lens.x;


lens.y =
    nav.y +
    nav.height / 2;

lens.targetY =
    lens.y;


lens.width =
    OPTICS.minWidth;

lens.height =
    OPTICS.minHeight;


requestAnimationFrame(
    frame
);

</script>

</body>
</html>
